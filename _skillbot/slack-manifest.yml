# 스킬봇 Slack 앱 복구용 manifest
# api.slack.com/apps → Create New App → "From a manifest" → 스폰지클럽 워크스페이스 선택 → 아래 전체 붙여넣기
# 도메인: https://sponge-skillers.vercel.app (Vercel 그대로 살아있음)
display_information:
  name: 스킬봇
  description: 스킬을 카탈로그로 올리고 검색하는 봇
features:
  bot_user:
    display_name: skillbot
    always_online: true
  slash_commands:
    - command: /스킬등록
      url: https://sponge-skillers.vercel.app/api/slack/command
      description: 스킬 올리기
      should_escape: false
    - command: /스킬검색
      url: https://sponge-skillers.vercel.app/api/slack/command
      description: 스킬 검색하기
      usage_hint: "<키워드>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - channels:history
      - groups:history
settings:
  interactivity:
    is_enabled: true
    request_url: https://sponge-skillers.vercel.app/api/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
