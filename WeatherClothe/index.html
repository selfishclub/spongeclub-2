<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeatherClothe — 날씨 기반 여행 준비</title>
<meta name="description" content="여행지와 날짜만 넣으면 최근 10년 실제 기온과 예보로 옷차림·준비물 리스트를 만들어 줍니다." />
<meta name="theme-color" content="#1a1aff" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="WeatherClothe" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1aff'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Helvetica,Arial' font-weight='bold' fill='%23fff' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />
<meta property="og:type" content="website" />
<meta property="og:title" content="WeatherClothe — 날씨 기반 여행 준비" />
<meta property="og:description" content="그 도시, 그 날짜의 날씨에 맞춰 여행 준비물을 한 번에." />
<meta name="twitter:card" content="summary" />
<!-- Pretendard: 한글/본문 · Anton: 포스터형 디스플레이(워드마크·숫자) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>WeatherClothe</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="header-prefs">
        <span id="home-baseline" class="home-baseline"></span>
        <div class="pref-toggles">
          <div class="unit-toggle" id="lang-toggle">
            <button type="button" class="unit-btn" data-lang="ko">한국어</button>
            <button type="button" class="unit-btn" data-lang="en">EN</button>
          </div>
          <div class="unit-toggle" id="unit-toggle">
            <button type="button" class="unit-btn" data-unit="C">°C</button>
            <button type="button" class="unit-btn" data-unit="F">°F</button>
          </div>
        </div>
      </div>
    </header>

    <div id="view-search" class="view active">
    <section class="input-card">
      <div class="field">
        <label for="city-input" data-i18n="labelCity"></label>
        <input id="city-input" type="text" data-i18n-placeholder="placeholderCity" autocomplete="off" />
        <div id="city-suggestions" class="suggestions hidden"></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="start-date" data-i18n="labelStart"></label>
          <input id="start-date" type="date" />
        </div>
        <div class="field">
          <label for="end-date" data-i18n="labelEnd"></label>
          <input id="end-date" type="date" />
        </div>
      </div>

      <div class="field">
        <label data-i18n="labelType"></label>
        <div class="type-toggle" id="type-toggle">
          <button type="button" class="type-btn" data-type="city" data-i18n="typeCity"></button>
          <button type="button" class="type-btn" data-type="activity" data-i18n="typeActivity"></button>
          <button type="button" class="type-btn" data-type="mixed" data-i18n="typeMixed"></button>
        </div>
        <p class="hint" id="type-hint"></p>
      </div>

      <div class="field">
        <label><span data-i18n="labelPurpose"></span> <span class="label-sub" data-i18n="purposeSub"></span></label>
        <div id="purpose-chips" class="purpose-chips"></div>
        <p class="hint" data-i18n="purposeHint"></p>
      </div>

      <div class="field">
        <label for="gender-pref"><span data-i18n="labelGender"></span> <span class="label-sub" data-i18n="genderSub"></span></label>
        <select id="gender-pref">
          <option value="" data-i18n="genderNone"></option>
          <option value="female" data-i18n="genderFemale"></option>
          <option value="male" data-i18n="genderMale"></option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="labelStyle"></label>
        <input type="file" id="photo-input" accept="image/*" multiple hidden />
        <button type="button" id="upload-btn" class="upload-btn" data-i18n="uploadBtn"></button>
        <p class="hint" data-i18n="uploadHint"></p>
        <div id="photo-preview" class="photo-preview hidden"></div>
        <div id="style-analysis" class="style-analysis hidden"></div>
        <select id="style-pref">
          <option value="minimal"></option>
          <option value="casual"></option>
          <option value="classic"></option>
          <option value="street"></option>
        </select>
      </div>

      <button id="submit-btn" class="submit-btn" data-i18n="submit"></button>
      <p id="error-msg" class="error hidden"></p>
    </section>
    </div>

    <div id="view-saved" class="view">
      <section id="saved-card" class="saved-card hidden"></section>
      <p id="saved-empty" class="view-empty" data-i18n-html="savedEmpty"></p>
    </div>

    <div id="view-results" class="view">
    <p id="results-empty" class="view-empty" data-i18n-html="resultsEmpty"></p>
    <section id="results" class="results hidden">
      <nav class="tabs">
        <button class="tab-btn active" data-tab="weather" data-i18n="tabWeather"></button>
        <button class="tab-btn" data-tab="reference" data-i18n="tabReference"></button>
        <button class="tab-btn" data-tab="outfit" data-i18n="tabOutfit"></button>
        <button class="tab-btn" data-tab="tips" data-i18n="tabTips"></button>
      </nav>

      <div id="tab-weather" class="tab-panel active">
        <div id="weather-summary" class="card"></div>
      </div>

      <div id="tab-reference" class="tab-panel">
        <div id="reference-content" class="card"></div>
      </div>

      <div id="tab-outfit" class="tab-panel">
        <p class="wardrobe-intro" data-i18n-html="wardrobeIntro"></p>
        <div id="outfit-list"></div>
        <div id="packing-list" class="card"></div>
      </div>

      <div id="tab-tips" class="tab-panel">
        <div id="tips-content" class="card"></div>
      </div>
    </section>
    </div>

    <nav class="app-nav" id="app-nav">
      <button type="button" class="nav-btn active" data-view="search"><span class="nav-ico">🔍</span><span data-i18n="navSearch"></span></button>
      <button type="button" class="nav-btn" data-view="results"><span class="nav-ico">🧳</span><span data-i18n="navResults"></span></button>
      <button type="button" class="nav-btn" data-view="saved"><span class="nav-ico">🔖</span><span data-i18n="navSaved"></span><span class="nav-badge hidden" id="nav-saved-count">0</span></button>
    </nav>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p id="loading-text" data-i18n="loadingText"></p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
